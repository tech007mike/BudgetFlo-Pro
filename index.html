<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
</head>
<body>
    <header>
        <h1>Nutrition Tracker</h1>
        <button id="menu-btn" aria-label="Toggle menu">☰</button>
    </header>
    <nav id="menu" class="hidden">
        <a href="add-food.html">Add Food</a>
        <a href="nutrition-facts.html">Manage Foods</a>
    </nav>
    <main>
        <h2>Today’s Summary</h2>
        <section>
            <table id="summary-table">
                <thead>
                    <tr>
                        <th>Food</th>
                        <th>Serving Size</th>
                        <th>Kcals</th>
                        <th>Protein (g)</th>
                        <th>Carbs (g)</th>
                        <th>Fat (g)</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="summary-body"></tbody>
                <tfoot>
                    <tr>
                        <td>Total</td>
                        <td></td>
                        <td id="total-kcals">0</td>
                        <td id="total-protein">0</td>
                        <td id="total-carbs">0</td>
                        <td id="total-fat">0</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </section>
        <section>
            <canvas id="macro-chart"></canvas>
        </section>
        <button onclick="window.location.href='add-food.html'">Add Food</button>
    </main>
    <script src="script.js"></script>
</body>
</html>
