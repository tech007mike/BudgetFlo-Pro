<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nutrition Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#28a745">
</head>
<body>
    <header>
        <h1>Nutrition Tracker</h1>
        <p class="subtitle">Daily Summary - Saturday, July 26, 2025, 08:34 PM EDT</p>
    </header>
    <main>
        <div id="macroPercentages">
            <h2>Macronutrient Breakdown</h2>
            <p>Fat: <span id="fatPercentage">0%</span></p>
            <p>Protein: <span id="proteinPercentage">0%</span></p>
            <p>Carbs: <span id="carbsPercentage">0%</span></p>
        </div>
        <div id="summaryContainer"></div>
        <div class="button-container">
            <button onclick="window.location.href='nutrition-facts.html'">Manage Database</button>
            <button onclick="window.location.href='add-food.html'">Log Food</button>
        </div>
    </main>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', displaySummary);
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/nutrition-tracker/sw.js')
                .then(() => console.log('Service Worker registered'))
                .catch((error) => console.error('Service Worker registration failed:', error));
        }
    </script>
</body>
</html>
