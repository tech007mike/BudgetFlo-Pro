<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nutrition Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Nutrition Tracker</h1>
        <p class="subtitle">Daily Summary - Sunday, July 13, 2025, 08:25 PM EDT</p>
    </header>
    <main>
        <!-- Macronutrient Percentage Section -->
        <div id="macroPercentages">
            <h2>Macronutrient Breakdown</h2>
            <p>Fat: <span id="fatPercentage">0%</span></p>
            <p>Protein: <span id="proteinPercentage">0%</span></p>
            <p>Carbs: <span id="carbsPercentage">0%</span></p>
        </div>
        <!-- Summary Table -->
        <table id="summaryTable">
            <thead>
                <tr>
                    <th>Food Details</th>
                    <th>Nutritional Info</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="summaryBody"></tbody>
        </table>
        <div class="button-container">
            <button onclick="window.location.href='nutrition-facts.html'">Manage Database</button>
            <button onclick="window.location.href='add-food.html'">Log Food</button>
        </div>
    </main>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', displaySummary);
    </script>
</body>
</html>
