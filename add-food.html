<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Log Food</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Log Food</h1>
    <label for="foodSelect">Select Food:</label>
    <select id="foodSelect" required>
        <option value="">Select a food</option>
    </select><br>
    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" min="1" value="1" required><br>
    <button onclick="consumeFood()">Log Consumption</button>
    <button onclick="window.location.href='index.html'">Back to Summary</button>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            populateFoodDropdown();
        });
    </script>
</body>
</html>
