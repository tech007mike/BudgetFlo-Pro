
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Food</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
</head>
<body>
    <header>
        <h1>Add Food</h1>
    </header>
    <main>
        <h2>Add Food to Summary</h2>
        <form id="add-food-form">
            <label for="food-select">Select Food:</label>
            <select id="food-select" required aria-label="Select a food"></select>
            <label for="quantity">Quantity: <span id="quantity-value">1</span></label>
            <input type="range" id="quantity" min="0.25" max="20" step="0.25" value="1" aria-label="Quantity slider">
            <button type="submit">Add to Summary</button>
        </form>
        <div class="floating-toolbars">
            <a href="index.html" class="toolbar-btn summary" aria-label="Back to Summary">📋 Summary</a>
            <a href="nutrition-facts.html" class="toolbar-btn manage-foods" aria-label="Manage Foods">🍎 Manage Foods</a>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
