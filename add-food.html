<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nutrition Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Nutrition Tracker</h1>
        <p class="subtitle">Log Food</p>
    </header>
    <main>
        <div class="form-group">
            <label for="foodSelect">Select Food:</label>
            <select id="foodSelect" name="foodSelect" required>
                <option value="">Select a food</option>
            </select>
        </div>
        <div class="form-group">
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" name="quantity" min="1" value="1" required>
        </div>
        <button onclick="consumeFood()">Log Consumption</button>
        <button onclick="window.location.href='index.html'" class="back-btn">Back to Summary</button>
    </main>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', populateFoodDropdown);
    </script>
</body>
</html>
