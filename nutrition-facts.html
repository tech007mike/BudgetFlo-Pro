<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Foods</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Manage Foods</h1>
    </header>
    <main>
        <h2>Add or Edit Food</h2>
        <form id="nutrition-form">
            <input type="hidden" id="food-id" value="">
            <label for="name">Item Name:</label>
            <input type="text" id="name" required maxlength="100" value="" aria-label="Food name">
            <label for="amount">Amount:</label>
            <input type="number" id="amount" step="0.01" min="0.01" required value="" aria-label="Serving amount">
            <label for="unit-type">Unit Type:</label>
            <input type="text" id="unit-type" maxlength="20" required value="" aria-label="Unit type">
            <label for="kcals">Kcals:</label>
            <input type="number" id="kcals" step="0.1" min="0" required value="0" aria-label="Calories">
            <label for="protein">Protein (g):</label>
            <input type="number" id="protein" step="0.1" min="0" required value="0" aria-label="Protein in grams">
            <label for="carbs">Carbs (g):</label>
            <input type="number" id="carbs" step="0.1" min="0" required value="0" aria-label="Carbs in grams">
            <label for="fat">Fat (g):</label>
            <input type="number" id="fat" step="0.1" min="0" required value="0" aria-label="Fat in grams">
            <button type="submit">Save Food</button>
        </form>
        <h2>Saved Foods</h2>
        <table id="foods-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Amount</th>
                    <th>Unit</th>
                    <th>Kcals</th>
                    <th>Protein</th>
                    <th>Carbs</th>
                    <th>Fat</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="foods-body"></tbody>
        </table>
        <div class="floating-toolbars">
            <a href="index.html" class="toolbar-btn summary" aria-label="Back to Summary">📋 Summary</a>
            <a href="add-food.html" class="toolbar-btn add-food" aria-label="Add Food">➕ Add Food</a>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
