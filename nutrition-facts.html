<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Foods</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
</head>
<body>
    <header>
        <h1>Nutrition Tracker</h1>
        <button id="menu-btn" aria-label="Toggle menu">☰</button>
    </header>
    <nav id="menu" class="hidden">
        <a href="index.html">Daily Summary</a>
        <a href="add-food.html">Add Food</a>
    </nav>
    <main>
        <h2>Manage Foods</h2>
        <section>
            <h3>Add or Edit Food</h3>
            <form id="nutrition-form">
                <input type="hidden" id="food-id">
                <label for="name">Item Name:</label>
                <input type="text" id="name" required maxlength="100" aria-label="Item name">
                <label for="amount">Amount (e.g., 1, 100):</label>
                <input type="number" id="amount" min="0.01" step="0.01" required aria-label="Serving amount">
                <label for="unit-type">Unit Type (e.g., cup, g):</label>
                <input type="text" id="unit-type" required maxlength="20" aria-label="Unit type">
                <label for="kcals">Kcals:</label>
                <input type="number" id="kcals" min="0" step="0.1" required aria-label="Calories">
                <label for="protein">Protein (g):</label>
                <input type="number" id="protein" min="0" step="0.1" required aria-label="Protein in grams">
                <label for="carbs">Carbs (g):</label>
                <input type="number" id="carbs" min="0" step="0.1" required aria-label="Carbs in grams">
                <label for="fat">Fat (g):</label>
                <input type="number" id="fat" min="0" step="0.1" required aria-label="Fat in grams">
                <button type="submit">Save Food</button>
            </form>
        </section>
        <section>
            <h3>Saved Foods</h3>
            <table id="foods-table">
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Amount</th>
                        <th>Unit Type</th>
                        <th>Kcals</th>
                        <th>Protein (g)</th>
                        <th>Carbs (g)</th>
                        <th>Fat (g)</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="foods-body"></tbody>
            </table>
        </section>
        <a href="index.html">Back to Summary</a>
    </main>
    <script src="script.js"></script>
</body>
</html>
