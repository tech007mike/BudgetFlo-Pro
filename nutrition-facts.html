<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manage Food Database</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Manage Food Database</h1>
    <form id="foodForm">
        <label>Food Name: <input type="text" id="foodName" required></label><br>
        <label>Serving Size: <input type="number" id="servingSize" required></label><br>
        <label>Serving Type: <input type="text" id="servingType" required></label><br>
        <label>Fat (g): <input type="number" id="fat" step="0.1" required></label><br>
        <label>Protein (g): <input type="number" id="protein" step="0.1" required></label><br>
        <label>Carbs (g): <input type="number" id="carbs" step="0.1" required></label><br>
        <label>Kcals: <input type="number" id="kcals" required></label><br>
        <button type="submit">Add Food</button>
    </form>
    <button onclick="window.location.href='index.html'">Back to Summary</button>
    <label for="foodSelect">Select Food to Edit:</label>
    <select id="foodSelect" name="foodSelect" style="max-height: 200px; overflow-y: auto;">
        <option value="">Select Food to Edit</option>
    </select>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', initDatabasePage);
    </script>
</body>
</html>
